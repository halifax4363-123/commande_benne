name: Compilation APK Benne

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.6' # Version stable idéale avec les anciennes extensions Bluetooth

      - name: Creer la structure Flutter
        run: |
          flutter create --platforms=android .
          rm lib/main.dart
          mv main.dart lib/main.dart
          flutter pub add flutter_bluetooth_serial permission_handler

      - name: Forcer les règles de compatibilité Android
        run: |
          # 1. Ajustement de la version minimale d'Android
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          
          # 2. Désactivation de la vérification stricte du Namespace pour Gradle
          echo "android.defaults.buildfeatures.namespace=true" >> android/local.properties

      - name: Compiler l'APK Release
        run: flutter build apk --split-per-abi

      - name: Archiver l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: telecommande-benne-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
